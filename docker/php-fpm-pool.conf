; PHP-FPM pool - tier M (16 GB RAM / 4 CPUs)
;
; Values from the enterprise optimisation guide's 16 GB profile:
;   pm.max_children 14 | start/min_spare 2 | max_spare 4
;
; Why 14 and not more: memory_limit is 256M, so 14 children is a 3.5 GB worst
; case. With MariaDB's 4 GB buffer pool that leaves comfortable headroom on a
; 16 GB box. The guide rates this tier at 35-50 sustained concurrent requests,
; which is far beyond what an internal dashboard for one division will see.

[www]
user = www-data
group = www-data

; TCP rather than a unix socket: the web tier is a separate container.
listen = 0.0.0.0:9000
; Only the web container may connect.
listen.allowed_clients = __FPM_ALLOWED_CLIENTS__

pm = dynamic
pm.max_children = 14
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500
pm.process_idle_timeout = 10s

; Expose the pool status to the web tier's health check only.
pm.status_path = /fpm-status
ping.path = /fpm-ping

request_terminate_timeout = 120s
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2

catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2

; Shell functions are disabled for WEB requests only. They are deliberately not
; in a conf.d ini file, because tools/create-admin.php runs under the CLI SAPI
; and needs shell_exec() to turn terminal echo off while a password is typed.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen
