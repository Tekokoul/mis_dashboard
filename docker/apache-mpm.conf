# Apache MPM event - tier M (16 GB RAM / 4 CPUs)
#
# MaxRequestWorkers 150 is the guide's 16 GB value. It is safe here because this
# tier runs NO PHP: Apache serves static files and proxies dynamic requests to
# PHP-FPM, which caps real concurrency at pm.max_children (14). Under mod_php
# the same 150 would mean 150 PHP processes and would exhaust a 16 GB box.

<IfModule mpm_event_module>
    ServerLimit              16
    MaxRequestWorkers        150
    ThreadsPerChild          25
    ThreadLimit              64
    MaxConnectionsPerChild   10000

    StartServers             2
    MinSpareThreads          25
    MaxSpareThreads          75
</IfModule>

KeepAlive                On
MaxKeepAliveRequests     500
KeepAliveTimeout         5
Timeout                  120
