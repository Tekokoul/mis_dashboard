; OPcache - tier M (16 GB RAM / 4 CPUs)
; memory_consumption 256 and interned_strings_buffer 32 are the guide's 16 GB row.

opcache.enable = 1
opcache.enable_cli = 0

opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 100000
opcache.max_wasted_percentage = 5

; The code never changes inside a running container, so there is nothing to
; revalidate. A deploy replaces the container, and that is what clears the cache.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

opcache.save_comments = 1
opcache.enable_file_override = 1

; JIT off: this is an I/O and database bound admin application, not a compute
; workload. The guide ships it off for the same reason.
opcache.jit = off
opcache.jit_buffer_size = 0

mysqlnd.collect_statistics = Off
mysqlnd.collect_memory_statistics = Off
