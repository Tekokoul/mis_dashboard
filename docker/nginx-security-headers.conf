# Security response headers, as an include.
#
# nginx's add_header does NOT inherit: any location that sets its own
# add_header (the caching blocks do) silently drops every header set at the
# server level. So the set lives here and is `include`d at the server level
# AND inside each location that adds headers of its own. Edit it in one place.
#
# `always` so the headers also ride on 4xx/5xx responses.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# TLS terminates at the reverse proxy; browsers ignore HSTS over plain http,
# so this is inert locally and effective in production.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Scripts: same origin, or inline with this request's nonce. nginx's
# $request_id is the nonce; the PHP location passes the same value to the app
# as CSP_NONCE and every inline <script> carries nonce="<?= csp_nonce(); ?>".
# No 'unsafe-inline', no 'unsafe-eval' (the theme's two eval() calls are in
# its Google-Maps styling, which this app never runs). Inline event handlers
# and javascript: links were replaced with listeners in ce.js.
# Styles, CSP3-style: <style> ELEMENTS need the nonce (the three inline
# blocks carry it; stylesheets are same-origin), while style ATTRIBUTES stay
# allowed - the theme sets style="" on many elements and an attribute cannot
# run script. style-src itself carries no 'unsafe-inline'. A browser without
# style-src-attr/-elem (Firefox < 108, Safari < 15.4) falls back to
# style-src and would drop inline style attributes - accepted for an internal
# tool on current Chrome/Edge. Fonts are self-hosted (public/vendor/fonts).
# The two sha256 hashes are two fixed <style> blocks the vendored jQuery /
# jQuery UI insert and remove during feature detection on every page; their
# content never changes, so a hash allows exactly them and nothing else.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'nonce-$request_id' 'sha256-CwE3Bg0VYQOIdNAkbB/Btdkhul49qZuwgNCMPgNY5zw=' 'sha256-MZKTI0Eg1N13tshpFaVW65co/LeICXq4hyVx6GWVlK0='; style-src-elem 'self' 'nonce-$request_id' 'sha256-CwE3Bg0VYQOIdNAkbB/Btdkhul49qZuwgNCMPgNY5zw=' 'sha256-MZKTI0Eg1N13tshpFaVW65co/LeICXq4hyVx6GWVlK0='; style-src-attr 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
