# Security response headers, as an include.
#
# nginx's add_header does NOT inherit: any location that sets its own
# add_header (the caching blocks do) silently drops every header set at the
# server level. So the set lives here and is `include`d at the server level
# AND inside each location that adds headers of its own. Edit it in one place.
#
# `always` so the headers also ride on 4xx/5xx responses.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# TLS terminates at the reverse proxy; browsers ignore HSTS over plain http,
# so this is inert locally and effective in production.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# The admin theme relies on inline scripts and styles, so 'unsafe-inline'
# stays for now; what this still buys is: no script from any other origin,
# no plugins/objects, no <base> hijack, forms post only to this origin, and
# the page cannot be framed elsewhere. Google Fonts is the one external host
# (login page).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
