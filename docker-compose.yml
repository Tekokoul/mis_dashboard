# Africa CDC DHIS Performance Monitor - production stack.
#
#   ./setup-production.sh          first install
#   docker compose up -d           start
#   docker compose logs -f web app follow
#   docker compose down            stop (data survives in the named volumes)
#
# Two services, tuned for a 16 GB / 4 CPU host (tier M of the enterprise
# optimisation profile):
#
#   app  nginx + PHP-FPM in one container - pm.max_children 14, OPcache 256M
#   db   MariaDB - innodb_buffer_pool_size 4G (override with DB_BUFFER_POOL)
#
# Worst-case resident memory: 4G buffer pool + 14x256M PHP + 256M OPcache plus
# overhead, comfortably inside 16 GB.
#
# The web tier listens on the host loopback only. Put a TLS-terminating reverse
# proxy in front of it and forward X-Forwarded-Proto and X-Forwarded-For.

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    # Command-line flags beat the mounted cnf, so the buffer pool can be sized
    # per host without editing the tier-M file: 4G suits the 16 GB production
    # server; set DB_BUFFER_POOL smaller on a constrained dev machine.
    command:
      - --innodb-buffer-pool-size=${DB_BUFFER_POOL:-4G}
    environment:
      MARIADB_DATABASE: ${DB_NAME:-afcdc_dhis}
      MARIADB_USER: ${DB_USER:-afcdc}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysqld-tuning.cnf:/etc/mysql/conf.d/zz-tuning.cnf:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    networks: [internal]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Stable per-deploy asset cache-buster. Without it the app falls back to
        # a per-minute value that defeats browser caching entirely.
        BUILD_ID: ${BUILD_ID:-dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-afcdc_dhis}
      DB_USER: ${DB_USER:-afcdc}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      # Used by the entrypoint ONLY for schema loading and idempotent
      # migrations (ALTER TABLE), so the app's own user can be limited to
      # SELECT/INSERT/UPDATE/DELETE. The application never sees it: the
      # entrypoint unsets it before PHP-FPM starts.
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}
      APP_URL: ${APP_URL:?APP_URL is required}
      APP_NAME: ${APP_NAME:-Africa CDC DHIS Performance Monitor}
      APP_DEBUG: ${APP_DEBUG:-false}
      PHP_TIMEZONE: ${PHP_TIMEZONE:-Africa/Addis_Ababa}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-172.16.0.0/12}
      REQUIREMENTS_ALLOW_FROM: ${REQUIREMENTS_ALLOW_FROM:-127.0.0.1}
    ports:
      # Loopback only. The reverse proxy is the sole public entry point.
      - "127.0.0.1:${HTTP_PORT:-8081}:80"
    volumes:
      # Uploaded media and the render cache must outlive the container. The code
      # is baked into the image, so a deploy is a rebuild, not a mount.
      - media:/var/www/html/public/media
      - cache:/var/www/html/public/cache
      # Per-user list preferences are written by the app at runtime; without
      # a volume every deploy reset them.
      - users_settings:/var/www/html/db/users_settings
    networks: [internal]

volumes:
  db_data:
  media:
  cache:
  users_settings:

networks:
  internal:
    driver: bridge
