# Africa CDC DHIS Performance Monitor - production stack.
#
#   ./setup-production.sh          first install
#   docker compose up -d           start
#   docker compose logs -f web app follow
#   docker compose down            stop (data survives in the named volumes)
#
# Three tiers, tuned for a 16 GB / 4 CPU host (tier M of the enterprise
# optimisation profile):
#
#   web  Apache event MPM - static files, MaxRequestWorkers 150, no PHP
#   app  PHP-FPM          - pm.max_children 14, memory_limit 256M, OPcache 256M
#   db   MariaDB          - innodb_buffer_pool_size 4G, max_connections 150
#
# Worst-case resident memory: 4G buffer pool + 14x256M PHP + 256M OPcache plus
# overhead, comfortably inside 16 GB.
#
# The web tier listens on the host loopback only. Put a TLS-terminating reverse
# proxy in front of it and forward X-Forwarded-Proto and X-Forwarded-For.

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-afcdc_dhis}
      MARIADB_USER: ${DB_USER:-afcdc}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysqld-tuning.cnf:/etc/mysql/conf.d/zz-tuning.cnf:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    networks: [internal]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        # Stable per-deploy asset cache-buster. Without it the app falls back to
        # a per-minute value that defeats browser caching entirely.
        BUILD_ID: ${BUILD_ID:-dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-afcdc_dhis}
      DB_USER: ${DB_USER:-afcdc}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      APP_URL: ${APP_URL:?APP_URL is required}
      APP_NAME: ${APP_NAME:-Africa CDC DHIS Performance Monitor}
      APP_DEBUG: ${APP_DEBUG:-false}
      PHP_TIMEZONE: ${PHP_TIMEZONE:-Africa/Addis_Ababa}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      # The FastCGI port is never published, so any host on the private compose
      # network may connect. It is not reachable from outside.
      FPM_ALLOWED_CLIENTS: ${FPM_ALLOWED_CLIENTS:-any}
    volumes:
      # Uploaded media and the render cache must outlive the container. The code
      # is baked into the image, so a deploy is a rebuild, not a mount.
      - media:/var/www/html/public/media
      - cache:/var/www/html/public/cache
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        BUILD_ID: ${BUILD_ID:-dev}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      APP_URL: ${APP_URL:?APP_URL is required}
      FPM_HOST: app
      FPM_PORT: 9000
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-172.16.0.0/12}
      REQUIREMENTS_ALLOW_FROM: ${REQUIREMENTS_ALLOW_FROM:-127.0.0.1}
    ports:
      # Loopback only. The reverse proxy is the sole public entry point.
      - "127.0.0.1:${HTTP_PORT:-8081}:80"
    volumes:
      # Apache serves uploaded media straight off disk without touching PHP, so
      # it needs the same media volume the app writes to. Read-only here.
      - media:/var/www/html/public/media:ro
    networks: [internal]

volumes:
  db_data:
  media:
  cache:

networks:
  internal:
    driver: bridge
