<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Africa CDC brand background">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0"   stop-color="#1A5632"/>
      <stop offset="0.55" stop-color="#164a2b"/>
      <stop offset="1"   stop-color="#0E3320"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0"    stop-color="#348F41" stop-opacity="0.30"/>
      <stop offset="0.62" stop-color="#348F41" stop-opacity="0"/>
    </linearGradient>
    <!-- AU gold hairline rule, used sparingly: the guide's 60/15/15 ratio keeps gold an accent -->
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#B4A269" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#B4A269" stop-opacity="0.55"/>
      <stop offset="1"   stop-color="#B4A269" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1200" fill="url(#field)"/>
  <rect width="1600" height="1200" fill="url(#sweep)"/>

  <!-- Concentric arcs: the continental-reach motif, held at low contrast so the
       login card stays the focus. Radii step by 190px from a centre off the left edge. -->
  <g fill="none" stroke="#348F41" stroke-opacity="0.16" stroke-width="1.5">
    <circle cx="180" cy="1020" r="380"/>
    <circle cx="180" cy="1020" r="570"/>
    <circle cx="180" cy="1020" r="760"/>
    <circle cx="180" cy="1020" r="950"/>
    <circle cx="180" cy="1020" r="1140"/>
  </g>
  <g fill="none" stroke="#B4A269" stroke-opacity="0.13" stroke-width="1.5">
    <circle cx="180" cy="1020" r="475"/>
    <circle cx="180" cy="1020" r="855"/>
  </g>

  <rect x="0" y="1136" width="1600" height="2" fill="url(#rule)"/>
</svg>
